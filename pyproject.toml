[project]
name = "mount"
version = "1.0.0"
description = "Wrapper around sys/mount.h"
authors = [{ name = "Ivan Fedorov", email = "inbox@titaniumhocker.ru" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["mount", "umount", "libc"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/TitaniumHocker/mount"
"Bug Tracker" = "https://github.com/TitaniumHocker/mount/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/mount"]

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-class-attributes = false
check-return-types = false

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pydoclint>=0.7",
    "pytest-cov>=6.0",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mount --cov-report=term-missing --cov-fail-under=90"
markers = [
    "root: test performs real mounts and needs CAP_SYS_ADMIN (see README)",
]
