[project]
name = "mount"
version = "2.0.0"
description = "Wrapper around sys/mount.h"
authors = [{ name = "Ivan Fedorov", email = "inbox@titaniumhocker.ru" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = []
keywords = ["mount", "umount", "libc"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/titaniumhocker/mount"
"Bug Tracker" = "https://github.com/titaniumhocker/mount/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pydoclint>=0.11.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
source-include = ["CHANGES.rst"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/mount"]

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-class-attributes = false
check-return-types = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mount --cov-report=term-missing --cov-fail-under=90"
markers = [
    "root: test performs real mounts and needs CAP_SYS_ADMIN (see README)",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
